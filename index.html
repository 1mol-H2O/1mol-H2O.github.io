<!doctype html>
<!--虽然可以省，但建议不要省-->

<html lang="zh-cn">
<!--html是根元素，莫得删，必须留
	lang 用于设置网页显示的语言
-->

<head>
	<!--这里面是有关网站的信息（元信息），浏览者看不到的东西（除非 Ctrl+U）-->

	<meta charset="utf-8" />
	<meta name="author"
		  content="1mol氢氧酸" />
	<meta name="description"
		  content="开发异次元版本、或自定义的操作系统" />
	<!--meta 功能很多
		charset 指定了网站编码格式是 UTF-8，它涵盖了几乎所有语言，这样大概率可以保证不会出现显示错误
		author 代表接下来的 content 标签里是这个网页的作者
		description 代表接下来的 content 标签里是这个网页的描述，在搜索引擎中搜索结果里会出现这段文字
	-->

	<title>1MOL羟氢酸</title>
	<!--这个是网站的标题，就是导航栏加载出来的那行文字-->

	<link rel="icon"
		  type="image/svg"
		  href="mainsite.svg" />
	<!--这个是网站的图标，格式差不多就是这样固定的，几个标签的顺序实际上是可以改变的-->

	<link rel="stylesheet"
		  href="title-char.css" />
	<!--这样的格式 stylesheet 可以用于引用 CSS 样式表-->

	<script src="" defer></script>
	<!--这样的格式 script 可以用于引用 JavaScript 脚本
		defer 将在加载完 HTML 元素后再加载，可以防止脚本访问未加载的HTML元素以至于报错
		script 引用外部的脚本时，标签中间是没有内容的；但也可以不引用，在 script中间写入脚本
	-->
</head>

<body>
	<!--显示出来的、浏览者能看到的所有内容都在这个里面-->

	<header>
		<!--页眉-->

		<h1>1mol羟氢酸</h1>
		<!--h? 代表标题，?是 1~6 的数字，其中 1 代表最重要，6 代表最不重要
			一些建议：h1级别的标题最好一个页面只用一次（因为那代表着总领全文）
			标题最好不要太多，级别三个已经很多也够用了（否则会显得笨重冗余）
		-->
	</header>

	<footer>
		<!--页脚-->
	</footer>
</body>
</html>

<!--以下是 style 页面设计部分-->

<style>
	@font-face {
		font-family: 'enFont';
		src: local('Segoe UI');
		font-style: italic;
		unicode-range: U+0030-0039, U+0041-005A, U+0061-007A;
		font-weight: 100;
	}

	@font-face {
		font-family: 'cnFont';
		src: local('Microsoft YaHei UI');
		font-style: normal;
		unicode-range: U+4E00-9FFF;
	}

	h1 { /*这个是大标题 H1 的自定义格式*/
		font-family: 'enFont','cnFont',serif;
		/*	先写 Segoe UI，它不识别中文；再写微软雅黑，它可以识别中文。
			当遇到英文时，会显示为 Segoe UI；当遇到中文时，Segoe UI 无法为中文提供字体，则显示为的微软雅黑
			serif/sans-serif 兼顾旧操作系统

			英文>MAC中文&Linux中文>Windows中文
		*/
		color: #44bbffcc; /*白色 with 80%透明*/
		font-size: 96px; /*设置字号*/
		font-weight: 600; /*设置加粗*/
	}

	body { /*这个是 body 的自定义格式*/
		height: 100vh; /*可以尝试一下去掉这两行……*/
		width: 100vw;
		background-image: url('background.svg');
		background-repeat: no-repeat;
		background-attachment:;
		background-size: cover;
	}
</style>

	<dl></dl>				Description List（描述列表）
